[project]
name = "minewtech-d15n-ha"
version = "0.1.0"
description = "Home Assistant custom integration for Minew D15N keychain BLE beacons"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "othorg" }]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["custom_components", "tests", "scripts"]
extend-exclude = ["Android", "iOS", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # flake8-bugbear
    "UP",           # pyupgrade
    "SIM",          # flake8-simplify
    "RUF",          # ruff-specific
    "PT",           # pytest-style
    "C4",           # comprehensions
    "TCH",          # type-checking imports
    "PL",           # pylint subset
]
ignore = [
    "PLR0913",      # too many arguments (HA entities legitimately have many)
    "E501",         # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]    # magic values + asserts ok in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# Pinned to 3.14 because HA Core 2026.5 itself uses PEP 758 (parenthesis-less
# except expressions) which mypy parses correctly only on 3.14+. The
# project-level ``requires-python = ">=3.13"`` still applies to our own
# code; ruff enforces 3.13-compatible syntax for the parts we own.
python_version = "3.14"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
files = ["custom_components/minewtech_d15n", "scripts"]
exclude = ['^Android/', '^iOS/', '\.venv/']

[[tool.mypy.overrides]]
module = ["homeassistant.*", "bleak.*", "habluetooth.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-q", "--strict-markers", "--strict-config"]
filterwarnings = [
    "error",
    # pytest-asyncio 1.3.x emits this deprecation on every async fixture
    # under pytest 9; the upstream fix lives in pytest-asyncio. Filter
    # narrowly so we still catch other deprecations.
    "ignore::pytest.PytestRemovedIn9Warning",
    # HA Core deprecation chatter from its module load on Python 3.14.
    "ignore::DeprecationWarning:homeassistant",
]
