name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compatibility_ha_minimum:
    name: import check (HA 2025.1, py3.13)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Home Assistant minimum + Linux-only deps
        run: |
          pip install --upgrade pip
          # Let HA 2025.1 pin a compatible dependency set itself.
          # Forcing newer transitive deps here (e.g. aioesphomeapi>=45)
          # can create resolver conflicts with HA's own pins.
          pip install "homeassistant==2025.1.4"

      - name: Import integration modules
        run: |
          PYTHONPATH=. python - <<'PY'
          import importlib
          modules = [
              "custom_components.minewtech_d15n",
              "custom_components.minewtech_d15n.const",
              "custom_components.minewtech_d15n.parser",
              "custom_components.minewtech_d15n.coordinator",
              "custom_components.minewtech_d15n.config_flow",
              "custom_components.minewtech_d15n.sensor",
              "custom_components.minewtech_d15n.device_tracker",
          ]
          for module in modules:
              importlib.import_module(module)
          print("HA minimum compatibility import check passed")
          PY

  test:
    name: pytest
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # pytest-homeassistant-custom-component 0.13.x depends on
          # Home Assistant Core 2026.x which requires Python 3.14.
          python-version: "3.14"
          allow-prereleases: true

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          # Install from range constraints, not the hash-pinned lock file.
          # The lock file is generated on macOS; binary-wheel hashes differ
          # per platform so --require-hashes fails on Linux.
          pip install \
            "pytest>=8.2" \
            "pytest-asyncio>=0.24" \
            "pytest-homeassistant-custom-component>=0.13" \
            "aiousbwatcher>=1.0" \
            "serialx>=1.0" \
            "aioesphomeapi>=45"

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=custom_components.minewtech_d15n \
            --cov-report=term-missing \
            --cov-fail-under=90
