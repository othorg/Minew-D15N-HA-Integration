name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint_py313:
    name: ruff (py3.13)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install lint tools
        run: |
          pip install --upgrade pip
          pip install "ruff>=0.5"

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

  lint_py314:
    name: ruff + mypy (py3.14)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Home Assistant Core 2026.x and its typing surface target
          # Python 3.14 syntax/features.
          python-version: "3.14"
          allow-prereleases: true

      - name: Install lint tools
        run: |
          pip install --upgrade pip
          # Install the HA test dependency set so mypy can resolve concrete
          # base classes (ConfigFlow, Entity, ScannerEntity, SensorEntity)
          # instead of treating them as Any.
          pip install \
            "ruff>=0.5" \
            "mypy>=1.11" \
            "pytest-homeassistant-custom-component>=0.13" \
            "aiousbwatcher>=1.0" \
            "serialx>=1.0" \
            "aioesphomeapi>=45"

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy
